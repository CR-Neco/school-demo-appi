[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "reportlab>=4.4,<5", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdf>=5,<7", "Pillow>=11,<13", "pypdfium2>=4.30,<6", "zxing-cpp>=2.3,<3"]

[tool.setuptools.packages.find]
include = ["appi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
appi = ["demo_data.json"]
